<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea Garden</title>
  <style>
    body { margin: 0; background: #f4f4e9; color: #233a2c; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 650px; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0; }
    .card, form { background: white; border: 1px solid #d9e1d6; border-radius: 12px; padding: 1.25rem; margin: 1rem 0; }
    label { display: block; margin: .75rem 0 .25rem; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .6rem; font: inherit; border: 1px solid #aebdb0; border-radius: 6px; }
    button { margin-top: 1rem; padding: .6rem 1rem; border: 0; border-radius: 6px; background: #315d3b; color: white; font: inherit; }
    .hint { color: #506657; }
  </style>
</head>
<body>
  <main>
    <h1>🌱 Idea Garden</h1>
    <p>Give your small ideas a place to grow.</p>
    <form>
      <label for="title">Idea</label>
      <input id="title" placeholder="A tiny neighborhood library" disabled>
      <label for="note">A note</label>
      <textarea id="note" placeholder="What could it become?" disabled></textarea>
      <button type="button" disabled>Plant idea</button>
      <p class="hint">Preview only — connect this form to the API to save ideas.</p>
    </form>
    <h2>Growing ideas</h2>
    <article class="card"><strong>A tiny neighborhood library</strong><p>Share favorite books with people nearby.</p></article>
  </main>
</body>
</html>
